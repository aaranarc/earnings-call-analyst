[project]
name = "quantrag"
version = "2.0.0.dev0"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
    "pdfplumber==0.11.10",
    "pypdf==6.20.1",
    "fastembed==0.9.0",
    "tokenizers==0.23.3",
    "numpy==2.4.6",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    "langchain-core==1.6.10",
    "langchain-google-genai==4.4.2",
    "pydantic==2.14.1",
    "psutil==7.2.2",
]

[project.optional-dependencies]
api = ["fastapi==0.143.2", "uvicorn==0.54.0", "python-dotenv==1.2.1"]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[tool.setuptools]
packages = ["ingest", "numcheck", "retrieve", "generate", "quantrag", "monitor"]

[tool.pytest.ini_options]
pythonpath = [".", "../scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
# our own modules, named explicitly so import order is the same whichever directory ruff runs from
known-first-party = ["ingest", "numcheck", "retrieve", "generate", "check_manifest"]
