# Free API option. Hosting/billing choice is intentionally deferred to the owner.
# For an always-on paid API, change the plan in Render after confirming the cost.
services:
  - type: web
    name: quantrag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: API_ACCESS_TOKEN
        generateValue: true
      - key: SUPABASE_DB_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: DAILY_REQUEST_LIMIT
        value: "100"
      - key: USAGE_DB_PATH
        value: /tmp/quantrag-usage.sqlite3
