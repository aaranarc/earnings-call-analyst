services:
  api:
    image: quantrag-api:release
    build: .
    environment:
      APP_ENV: production
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?Set a random server-only API_ACCESS_TOKEN}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?Set SUPABASE_DB_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:?Set GEMINI_MODEL}
      DAILY_REQUEST_LIMIT: ${DAILY_REQUEST_LIMIT:-100}
      USAGE_DB_PATH: /app/usage/budget.sqlite3
    volumes:
      - usage:/app/usage
    # Only the web service can reach the API; no published API port.
    expose: ["8000"]
    init: true
    restart: unless-stopped
  web:
    image: quantrag-web:release
    build:
      context: .
      dockerfile: ui/Dockerfile
    environment:
      API_ORIGIN: http://api:8000
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?Set API_ACCESS_TOKEN}
    ports: ["8501:8501"]
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
volumes:
  usage:
