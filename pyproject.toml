[project]
name = "quantrag-dashboard"
version = "2.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit==1.66.1",
    "httpx==0.28.1",
    "python-dotenv==1.2.1",
    "altair==5.5.0",
    "pandas==2.3.3",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
pythonpath = [".", "backend", "scripts"]
