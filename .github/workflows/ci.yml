name: CI

on:
  push:
    branches: [v2, main, "codex/**"]
  pull_request:
    branches: [v2, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Throwaway service container on localhost; the DB tests refuse any non-localhost URL.
      TEST_DATABASE_URL: postgresql://postgres:pg@localhost:5432/postgres
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('backend/retrieve/search.py') }}

      - name: Install
        run: pip install -c backend/requirements-api.lock -e "backend[dev,api]"

      - name: Lint
        run: ruff check backend scripts eval --config backend/pyproject.toml

      - name: Check bundled public snapshots
        run: |
          python scripts/build_company_monitor.py --check
          python scripts/build_growth_payoff.py --check
          python scripts/export_public_data.py --check
          python scripts/save_example_answers.py --check
          python scripts/export_development_results.py --check

      - name: Test with coverage
        working-directory: backend
        run: |
          pytest tests ../scripts -q \
            --cov=ingest --cov=numcheck --cov=retrieve --cov=generate --cov=quantrag --cov=monitor --cov=check_manifest \
            --cov-report=term | tee pytest.txt
          {
            echo "### Tests"
            echo '```'
            grep -E "passed|failed|skipped" pytest.txt | tail -1
            grep -E "^TOTAL" pytest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
